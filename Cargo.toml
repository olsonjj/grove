[workspace]
resolver = "3"
members = ["crates/*"]

# Remove when the GPUI dependency graph drops block 0.1.6 or upstream releases
# an inhabited opaque declaration for `_NSConcreteStackBlock`; see vendor/block/PATCH.md.
[patch.crates-io]
block = { path = "vendor/block" }

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false

[workspace.dependencies]
gpui-kit = "=0.7.0"
tray-icon = { version = "=0.26.0", default-features = false }
global-hotkey = "=0.8.0"
async-channel = "=2.5.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tempfile = "=3.27.0"
notify = "=8.2.0"
libc = "=0.2.190"
thiserror = "=2.0.21"
grove-core = { path = "crates/grove-core" }
objc2 = "=0.6.4"
objc2-foundation = "=0.3.2"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSAppearance",
    "NSEvent",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSWorkspace",
] }
objc2-service-management = { version = "=0.3.2", default-features = false, features = [
    "std",
    "SMAppService",
    "objc2",
    "objc2-foundation",
] }

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
